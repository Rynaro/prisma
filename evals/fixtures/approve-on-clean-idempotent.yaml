id: approve-on-clean-idempotent
name: "approve_on_clean is idempotent: an existing approval is not duplicated"
description: >-
  A prior APPROVE review by this App already exists on the PR (from an
  earlier clean synchronize round). A second clean run with
  approval.approve_on_clean enabled must find the existing undismissed
  approval via findOurApproval and NOT submit a second one.

config_overrides:
  mode: summary-plus-inline
  approval:
    celebrate_clean: true
    clean_conclusion: success
    approve_on_clean: true

pr_payload:
  action: synchronize
  installation:
    id: 1000
  repository:
    id: 2000
    full_name: octocat/hello-world
    name: hello-world
    owner:
      login: octocat
  pull_request:
    number: 204
    head:
      sha: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"

octokit_responses:
  pulls_get:
    number: 204
    head:
      sha: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      ref: feature/approve-on-clean
    base:
      sha: "cccccccccccccccccccccccccccccccccccccccc"
      ref: main
  pulls_list_files:
    - filename: src/util/tidy2.ts
      status: modified
      additions: 1
      deletions: 1
      patch: |
        @@ -1,3 +1,3 @@
        -export const a = (s) => s;
        +export const tidy2 = (s) => s;
         export const b = (s) => s;
  prior_reviews:
    - id: 555
      state: APPROVED
      user:
        login: "prisma-bot[bot]"
        type: Bot
      commit_id: "ffffffffffffffffffffffffffffffffffffffff"

provider_script:
  - kind: output
    output:
      findings: []

expectations:
  prefilter:
    outcome: accepted
    skipped_paths: []
    skipped_reasons: []
    files_sent_to_provider: 1
  provider:
    calls: 1
  validator:
    findings: 0
    rejection_reasons: []
  ranker:
    output_size_eq_input: true
  publisher:
    inline_count: 0
    summary_count: 0
    dropped_count: 0
    publication_state: succeeded
    summary_contains:
      - "Prisma reviewed this PR and found no issues"
    expected_categories: []
    rejection_reasons: []
    check_conclusion: success
    approvals_submitted: 0
    approval_dismissals: 0

metrics:
  - comment_usefulness
