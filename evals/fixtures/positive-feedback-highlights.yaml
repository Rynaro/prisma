id: positive-feedback-highlights
name: "Positive feedback: highlights capped at max_items"
description: >-
  positive_feedback is enabled with max_items: 2; the provider emits four
  distinct highlights. The validator caps and dedupes them (dedupe before
  cap), so only the first two survive into the rendered Highlights section
  and the other two never appear in the check-run summary.

config_overrides:
  mode: summary-plus-inline
  positive_feedback:
    enabled: true
    max_items: 2

pr_payload:
  action: opened
  installation:
    id: 1000
  repository:
    id: 2000
    full_name: octocat/hello-world
    name: hello-world
    owner:
      login: octocat
  pull_request:
    number: 201
    head:
      sha: "5555555555555555555555555555555555555555"

octokit_responses:
  pulls_get:
    number: 201
    head:
      sha: "5555555555555555555555555555555555555555"
      ref: feature/positive-feedback
    base:
      sha: "6666666666666666666666666666666666666666"
      ref: main
  pulls_list_files:
    - filename: src/util/format.ts
      status: modified
      additions: 4
      deletions: 1
      patch: |
        @@ -1,4 +1,7 @@
        -export const fmt = (s) => s.trim();
        +export const formatString = (s: string): string => s.trim();
        +export const upperCase = (s: string): string => s.toUpperCase();
         export const upper = (s) => s.toUpperCase();

provider_script:
  - kind: output
    output:
      findings: []
      highlights:
        - path: src/util/format.ts
          message: "Added explicit parameter and return types"
          rationale: "Improves type safety and IDE tooling for callers."
        - message: "Descriptive function name formatString"
          rationale: "Clarifies intent over the previous fmt abbreviation."
        - message: "Third highlight beyond the cap"
          rationale: "Should be dropped by the max_items cap."
        - message: "Fourth highlight beyond the cap"
          rationale: "Should also be dropped by the max_items cap."

expectations:
  prefilter:
    outcome: accepted
    skipped_paths: []
    skipped_reasons: []
    files_sent_to_provider: 1
  provider:
    calls: 1
  validator:
    findings: 0
    rejection_reasons:
      - highlight_over_cap
  ranker:
    output_size_eq_input: true
  publisher:
    inline_count: 0
    summary_count: 0
    dropped_count: 0
    publication_state: succeeded
    summary_contains:
      - "### Highlights (2)"
      - "Added explicit parameter and return types"
      - "Descriptive function name formatString"
    summary_not_contains:
      - "Third highlight beyond the cap"
      - "Fourth highlight beyond the cap"
    expected_categories: []
    rejection_reasons: []
    approvals_submitted: 0
    approval_dismissals: 0

metrics:
  - comment_usefulness
