id: clean-review-approve-on-clean
name: "Clean review: approve_on_clean submits a real GitHub approval"
description: >-
  approval.approve_on_clean is enabled alongside clean_conclusion: success.
  On a genuinely clean review the publisher submits exactly one approving PR
  review and flips the check-run conclusion to success.

config_overrides:
  mode: summary-plus-inline
  approval:
    celebrate_clean: true
    clean_conclusion: success
    approve_on_clean: true

pr_payload:
  action: opened
  installation:
    id: 1000
  repository:
    id: 2000
    full_name: octocat/hello-world
    name: hello-world
    owner:
      login: octocat
  pull_request:
    number: 203
    head:
      sha: "9999999999999999999999999999999999999999"

octokit_responses:
  pulls_get:
    number: 203
    head:
      sha: "9999999999999999999999999999999999999999"
      ref: feature/approve-on-clean
    base:
      sha: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      ref: main
  pulls_list_files:
    - filename: src/util/tidy.ts
      status: modified
      additions: 1
      deletions: 1
      patch: |
        @@ -1,3 +1,3 @@
        -export const a = (s) => s;
        +export const tidy = (s) => s;
         export const b = (s) => s;

provider_script:
  - kind: output
    output:
      findings: []

expectations:
  prefilter:
    outcome: accepted
    skipped_paths: []
    skipped_reasons: []
    files_sent_to_provider: 1
  provider:
    calls: 1
  validator:
    findings: 0
    rejection_reasons: []
  ranker:
    output_size_eq_input: true
  publisher:
    inline_count: 0
    summary_count: 0
    dropped_count: 0
    publication_state: succeeded
    summary_contains:
      - "Prisma reviewed this PR and found no issues"
    expected_categories: []
    rejection_reasons: []
    check_conclusion: success
    approvals_submitted: 1
    approval_dismissals: 0

metrics:
  - comment_usefulness
