id: clean-review-approval-message
name: "Clean review: celebrate_clean replaces _No findings._ with an approval message"
description: >-
  approval.celebrate_clean is enabled; the provider returns zero findings on a
  real review. The rendered summary substitutes the dry "_No findings._" +
  empty-review notice with the positive approval message, while the
  check-run conclusion stays neutral (clean_conclusion defaults to neutral).

config_overrides:
  mode: summary-plus-inline
  approval:
    celebrate_clean: true

pr_payload:
  action: opened
  installation:
    id: 1000
  repository:
    id: 2000
    full_name: octocat/hello-world
    name: hello-world
    owner:
      login: octocat
  pull_request:
    number: 202
    head:
      sha: "7777777777777777777777777777777777777777"

octokit_responses:
  pulls_get:
    number: 202
    head:
      sha: "7777777777777777777777777777777777777777"
      ref: feature/clean-review
    base:
      sha: "8888888888888888888888888888888888888888"
      ref: main
  pulls_list_files:
    - filename: src/util/rename.ts
      status: modified
      additions: 1
      deletions: 1
      patch: |
        @@ -1,3 +1,3 @@
        -export const old = (s) => s;
        +export const renamed = (s) => s;
         export const other = (s) => s;

provider_script:
  - kind: output
    output:
      findings: []

expectations:
  prefilter:
    outcome: accepted
    skipped_paths: []
    skipped_reasons: []
    files_sent_to_provider: 1
  provider:
    calls: 1
  validator:
    findings: 0
    rejection_reasons: []
  ranker:
    output_size_eq_input: true
  publisher:
    inline_count: 0
    summary_count: 0
    dropped_count: 0
    publication_state: succeeded
    summary_contains:
      - "Prisma reviewed this PR and found no issues"
    summary_not_contains:
      - "_No findings._"
      - "lower your"
    expected_categories: []
    rejection_reasons: []
    check_conclusion: neutral
    approvals_submitted: 0
    approval_dismissals: 0

metrics:
  - comment_usefulness
