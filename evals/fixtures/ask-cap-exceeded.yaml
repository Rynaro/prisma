id: ask-cap-exceeded
name: "Reviewer interaction: cap exceeded"
description: >-
  interactions.enabled is true with max_per_review=1. One interaction has
  already been posted this round (round=2, seq=1 — replayed via
  prior_issue_comments). A second `ask` in the same round MUST be denied
  with a cap notice and MUST NOT call the provider (anti-chat-abuse guard,
  spec § 5 / § 9: "AS a developer, WHEN the round's budget (max_per_review)
  is spent, THEN further asks get a polite cap notice and no provider call
  happens").

  Note: routed to the ask runner (`ask_request` present); the
  `provider_script`/most of `expectations` below are unused placeholders.

config_overrides:
  interactions:
    enabled: true
    max_per_review: 1

pr_payload:
  action: opened
  installation:
    id: 3001
  repository:
    id: 4001
    full_name: octocat/hello-world
    name: hello-world
    owner:
      login: octocat
  pull_request:
    number: 302
    head:
      sha: "3333333333333333333333333333333333333c"

octokit_responses:
  pulls_get:
    number: 302
    head:
      sha: "3333333333333333333333333333333333333c"
      ref: fix/payment-race
    base:
      sha: "4444444444444444444444444444444444444d"
      ref: main
    title: "Fix payment race condition"
    body: null
  pulls_list_files: []
  prior_check_runs:
    - id: 1
      conclusion: neutral
      output_summary: |
        Round 2 · 1 still open

        <!-- prisma-bot:round=2 head=deadbeef -->
  prior_issue_comments:
    - id: 9001
      body: |
        > **@bob asked:** is this finding a false positive?

        No — it's reachable from the public route handler.

        <!-- prisma-bot:interaction round=2 seq=1 -->

provider_script: []

expectations:
  prefilter:
    outcome: all-excluded
    skipped_paths: []
    skipped_reasons: []
    files_sent_to_provider: 0
  provider:
    calls: 0
  validator:
    findings: 0
    rejection_reasons: []
  ranker:
    output_size_eq_input: true
  publisher:
    inline_count: 0
    summary_count: 0
    dropped_count: 0
    publication_state: succeeded
    expected_categories: []
    rejection_reasons: []
    approvals_submitted: 0
    approval_dismissals: 0

metrics:
  - comment_usefulness

ask_request:
  commenter_login: carol
  message: "one more question about this round"

ask_expectations:
  kind: cap_exceeded
  reply_contains: []
  reply_not_contains: []
  provider_calls: 0
