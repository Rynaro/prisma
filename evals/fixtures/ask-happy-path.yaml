id: ask-happy-path
name: "Reviewer interaction: ask happy path"
description: >-
  interactions.enabled is true and a review round has already been published
  (round=2, harvested from the check-run summary marker). A developer asks a
  question; provider.respond() is called exactly once (FakeProvider's
  deterministic canned reply, per spec § 6) and the reply is a self-contained
  comment: blockquoted question + reply + the hidden interaction marker
  (round=2 seq=1).

  Per docs/_planning/reviewer-interaction/spec.md § 9 acceptance:
  "AS a developer, WHEN I comment `@bot ask <question>` on a reviewed PR
  (feature enabled), THEN the bot replies ... and the reply carries the
  interaction marker."

  Note: this scenario is routed to the ask runner (`ask_request` present),
  NOT the review-pipeline runner — the `provider_script`/most of
  `expectations` below are unused placeholders required by the shared
  fixture schema (see schema.ts § ask_request doc comment).

config_overrides:
  interactions:
    enabled: true
    max_per_review: 3

pr_payload:
  action: opened
  installation:
    id: 3000
  repository:
    id: 4000
    full_name: octocat/hello-world
    name: hello-world
    owner:
      login: octocat
  pull_request:
    number: 301
    head:
      sha: "1111111111111111111111111111111111111a"

octokit_responses:
  pulls_get:
    number: 301
    head:
      sha: "1111111111111111111111111111111111111a"
      ref: fix/payment-race
    base:
      sha: "2222222222222222222222222222222222222b"
      ref: main
    title: "Fix payment race condition"
    body: "Guards the charge handler with a mutex."
  pulls_list_files: []
  prior_check_runs:
    - id: 1
      conclusion: neutral
      output_summary: |
        Round 2 · 1 still open

        <!-- prisma-bot:round=2 head=deadbeef -->

provider_script: []

expectations:
  prefilter:
    outcome: all-excluded
    skipped_paths: []
    skipped_reasons: []
    files_sent_to_provider: 0
  provider:
    calls: 0
  validator:
    findings: 0
    rejection_reasons: []
  ranker:
    output_size_eq_input: true
  publisher:
    inline_count: 0
    summary_count: 0
    dropped_count: 0
    publication_state: succeeded
    expected_categories: []
    rejection_reasons: []
    approvals_submitted: 0
    approval_dismissals: 0

metrics:
  - comment_usefulness

ask_request:
  commenter_login: alice
  message: "why is finding 2 a security risk? we sanitize upstream"

ask_expectations:
  kind: replied
  reply_contains:
    - "> **@alice asked:** why is finding 2 a security risk? we sanitize upstream"
    - "Round 2"
    - "<!-- prisma-bot:interaction round=2 seq=1 -->"
  reply_not_contains: []
  provider_calls: 1
